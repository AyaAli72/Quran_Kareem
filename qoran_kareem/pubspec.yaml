name: quran_kareem
description: القرآن الكريم - تطبيق شامل للقرآن الكريم مع التفسير والتلاوة
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI and Design
  cupertino_icons: ^1.0.2
  provider: ^6.0.5  # State management
  
  # PDF and Document
  pdfx: ^2.6.0
  # pdf_flutter: ^4.2.0  # Alternative PDF library
  
  # Audio/Video
  audioplayers: ^5.1.0  # For playing Quran recitations
  video_player: ^2.8.2  # For video content
  
  # Network and Data
  http: ^1.1.0  # For API calls
  shared_preferences: ^2.2.1  # For local storage
  sqflite: ^2.3.0  # Database for bookmarks and notes
  
  # Utilities
  url_launcher: ^6.1.14  # For opening external links
  path_provider: ^2.0.15  # File system access
  flutter_localizations:
    sdk: flutter  # For RTL support
  intl: ^0.18.1  # Internationalization
  
  # UI Enhancements
  flutter_svg: ^2.0.9  # For SVG icons
  shimmer: ^3.0.0  # Loading effects
  lottie: ^2.7.0  # Animations
  carousel_slider: ^4.2.1  # For image carousels

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon1.jpg"
  adaptive_icon_background: "#2E7D32"  # Green background for adaptive icon
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"  # Optional
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  # Enable RTL for Arabic
  generate: true
  
  # Assets
  assets:
    - assets/icons/
    - assets/images/
    - assets/pdf/
    # - assets/audio/  # For Quran recitations
    # - assets/translations/  # For multi-language support
    # - assets/animations/  # For Lottie files
    # - assets/fonts/
    
  # Fonts (Uncomment and add your font files)
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
        - asset: assets/fonts/Amiri-Italic.ttf
          style: italic
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
    - family: Scheherazade
      fonts:
        - asset: assets/fonts/Scheherazade-Regular.ttf
  
  # Splash screen configuration (for Flutter 2.5+)
  # flutter_native_splash:
  #   color: "#2E7D32"
  #   image: assets/images/splash.png
  #   android: true
  #   ios: true